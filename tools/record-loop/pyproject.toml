[project]
name = "record-loop"
version = "0.1.0"
description = "Record-quality scorer for narduk-sound: measures engine renders against reference records."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "pyloudnorm",
]

[project.optional-dependencies]
# Stem separation (Demucs, MIT) and Frechet Audio Distance (fadtk, MIT). Heavy: torch.
stems = ["demucs", "torch", "torchaudio"]
fad = ["fadtk", "torchcodec"]

[project.scripts]
record-loop = "record_loop.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
